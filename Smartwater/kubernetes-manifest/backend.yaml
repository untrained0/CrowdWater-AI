# DATABASE_URL comes from a Kubernetes Secret. Create it before applying this manifest:
#   kubectl create secret generic nestjs-backend-secrets --from-literal=DATABASE_URL='mongodb+srv://USER:PASSWORD@HOST/SmartWater'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nestjs-backend
  template:
    metadata:
      labels:
        app: nestjs-backend
    spec:
      containers:
      - name: nestjs-backend
        image: untrainedtrash12/smartwater-api-dev:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "YOUR_AWS_ACCESS_KEY_ID"  
        - name: AWS_SECRET_ACCESS_KEY
          value: "YOUR_AWS_SECRET_ACCESS_KEY"
        - name: AWS_S3_REGION
          value: "us-east-1"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nestjs-backend-secrets
              key: DATABASE_URL
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nestjs-backend
spec:
  selector:
    app: nestjs-backend
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 31675
